<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون آنلاین سنجش آغازین — پایه هفتم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Vazirmatn", "B Nazanin", "B Mitra", Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; color: #2c3e50; padding: 20px; direction: rtl; }
  .container { max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2); margin-bottom: 20px; }
  .header { text-align: center; margin-bottom: 20px; }
  .header .basmala { font-size: 13px; color: #555; margin-bottom: 2px; }
  .header h1 { font-size: 22px; color: #1e3c72; margin: 4px 0; }
  .header h2 { font-size: 15px; color: #2a5298; margin: 2px 0; font-weight: normal; }
  .header .meta { font-size: 12px; color: #777; margin-top: 6px; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle;
    text-align: center; font-size: 0.85em; line-height: 1.1; margin: 0 3px;
    font-family: "Cambria Math", "Times New Roman", serif;
    position: relative; top: -0.15em; }
  .frac > .num { border-bottom: 1.3px solid currentColor; padding: 0 4px 1px; display: block; }
  .frac > .den { padding: 1px 4px 0; display: block; }
  .formula { direction: ltr; unicode-bidi: isolate; display: inline-block;
    font-family: "Cambria Math", "Times New Roman", serif; margin: 0 2px; }
  .center-formula { text-align: center; margin: 6px 0; font-size: 15px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #1e3c72; }
  .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0;
    border-radius: 8px; font-family: inherit; font-size: 15px; transition: border-color .2s; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #2a5298; }
  .btn { padding: 12px 24px; border: none; border-radius: 8px;
    font-family: inherit; font-size: 15px; font-weight: bold;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.2); }
  .btn-primary { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; }
  .btn-success { background: #27ae60; color: #fff; }
  .btn-warning { background: #f39c12; color: #fff; }
  .btn-danger  { background: #c0392b; color: #fff; }
  .btn-info    { background: #2980b9; color: #fff; }
  .btn-block { width: 100%; justify-content: center; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .exam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media(max-width:600px) { .exam-grid { grid-template-columns: 1fr; } }
  .exam-card { background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 12px;
    padding: 18px; text-align: center; cursor: pointer; transition: all .2s; }
  .exam-card:hover { border-color: #2a5298; transform: translateY(-2px); }
  .exam-card.done { background: #d4edda; border-color: #27ae60; cursor: not-allowed; }
  .exam-card h3 { font-size: 15px; color: #1e3c72; margin-bottom: 6px; }
  .exam-card .status { font-size: 13px; color: #666; }
  .exam-card .score { font-size: 22px; font-weight: bold; color: #27ae60; margin-top: 4px; }
  .question { margin-bottom: 16px; padding: 14px; background: #f8f9fa;
    border-radius: 10px; border-right: 4px solid #2a5298; }
  .question .q-text { font-weight: bold; margin-bottom: 10px; font-size: 14px; line-height: 1.9; }
  .option { display: flex; align-items: center; padding: 10px 12px; margin: 5px 0;
    background: #fff; border: 2px solid #e0e0e0; border-radius: 8px;
    cursor: pointer; transition: all .15s; font-size: 14px; line-height: 1.9; }
  .option:hover { border-color: #2a5298; background: #f0f5ff; }
  .option input { margin-left: 10px; }
  .option.selected { background: #d4edda; border-color: #27ae60; }
  .timer { position: sticky; top: 10px; background: #1e3c72; color: #fff;
    padding: 10px 20px; border-radius: 10px; text-align: center;
    font-size: 18px; font-weight: bold; margin-bottom: 14px; z-index: 100; }
  .timer.warning { background: #c0392b; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px;
    overflow: hidden; margin-bottom: 16px; }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71);
    transition: width .3s; }
  .report { background: #fff; padding: 30px; }
  .report-header { text-align: center; border-bottom: 3px double #1e3c72;
    padding-bottom: 14px; margin-bottom: 20px; }
  .report-header .basmala { font-size: 13px; color: #555; }
  .report-header h1 { color: #1e3c72; font-size: 22px; margin: 4px 0; }
  .report-header h2 { color: #555; font-size: 15px; font-weight: normal; margin-top: 4px; }
  .report-header h3 { color: #2a5298; font-size: 17px; margin-top: 8px; }
  .student-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 20px; padding: 14px; background: #f8f9fa; border-radius: 10px; }
  .student-info div { font-size: 14px; }
  .student-info b { color: #1e3c72; }
  .report-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  .report-table th, .report-table td { border: 1px solid #ddd; padding: 10px;
    text-align: center; font-size: 14px; }
  .report-table th { background: #1e3c72; color: #fff; }
  .report-table tr:nth-child(even) { background: #f8f9fa; }
  .report-table .total { background: #fff3cd; font-weight: bold; }
  .report-footer { text-align: center; margin-top: 24px; padding-top: 16px;
    border-top: 1px solid #ddd; font-size: 13px; color: #666; line-height: 2; }
  .notice { padding: 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; line-height: 1.8; }
  .notice-info { background: #d1ecf1; color: #0c5460; border-right: 4px solid #17a2b8; }
  .notice-success { background: #d4edda; color: #155724; border-right: 4px solid #27ae60; }
  .notice-warning { background: #fff3cd; color: #856404; border-right: 4px solid #f39c12; }
  .notice-danger { background: #f8d7da; color: #721c24; border-right: 4px solid #c0392b; }
  .status-bar { position: fixed; bottom: 10px; left: 10px; padding: 8px 16px;
    border-radius: 20px; font-size: 12px; font-weight: bold;
    box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 999; }
  .status-online { background: #27ae60; color: #fff; }
  .status-offline { background: #f39c12; color: #fff; }
  .status-syncing { background: #2980b9; color: #fff; }
  @page { size: A4 portrait; margin: 15mm; }
  @media print {
    body { background: #fff !important; padding: 0; margin: 0; }
    .no-print, .status-bar { display: none !important; }
    .card { box-shadow: none; margin: 0; padding: 0; }
    .report { padding: 10mm; }
  }
</style>
</head>
<body>

<div class="container" id="app"></div>
<div id="statusBar" class="status-bar status-online">🌐 متصل</div>

<script>
/* ==================== تنظیمات ==================== */
const GRADE = "هفتم";
const YEAR = "۱۴۰۶-۱۴۰۵";
const EXAM_DATE = "۱۴۰۵/۰۷/۱۸";
const SCHOOL = "آموزشگاه شهید مفتح";

/* ⚠️ URL Apps Script خود را اینجا جایگزین کنید: */
const EXAM_ENDPOINT = "https://script.google.com/macros/s/AKfyc.../exec";

/* ==================== توابع کمکی ==================== */
const F = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const M = (s) => `<span class="formula">${s}</span>`;
const C = (s) => `<div class="center-formula"><span class="formula">${s}</span></div>`;

/* ==================== داده‌های آزمون‌ها ==================== */
const EXAMS = [
  /* ============ ۱. ریاضی ششم ============ */
  {
    id: "math6", title: "ریاضی ششم", duration: 15,
    questions: [
      { q: `حاصل ${F("۲","۳")} + ${F("۱","۶")} کدام است؟`,
        options: [F("۳","۹"), F("۱","۲"), F("۲","۹"), F("۵","۶")], correct: 3 },
      { q: `عدد ۰٫۲۵ معادل کدام کسر است؟`,
        options: [F("۱","۵"), F("۲","۵"), F("۱","۴"), F("۳","۴")], correct: 2 },
      { q: `حاصل ${F("۲","۳")} × ${F("۳","۴")} کدام است؟`,
        options: [F("۱","۴"), F("۳","۸"), F("۱","۲"), F("۳","۴")], correct: 2 },
      { q: `اگر ۴۰٪ از یک عدد برابر ۱۲ باشد، آن عدد کدام است؟`,
        options: ["۲۰","۲۴","۴۸","۳۰"], correct: 3 },
      { q: `مساحت مثلثی با قاعده ۸ و ارتفاع ۵ کدام است؟`,
        options: ["۱۳","۲۰","۴۰","۸۰"], correct: 1 },
      { q: `میانگین اعداد ۵، ۷، ۹ و ۱۱ کدام است؟`,
        options: ["۸","۷","۹","۱۰"], correct: 0 },
      { q: `حاصل عبارت زیر کدام است؟<br>${C("۲ × (۵ + ۳) − ۴")}`,
        options: ["۱۲","۱۴","۱۶","۲۰"], correct: 0 },
      { q: `رابطه دو عدد ۰٫۳ و ۰٫۳۰ کدام است؟`,
        options: ["۰٫۳ بزرگ‌تر است","۰٫۳۰ بزرگ‌تر است","مساوی‌اند","قابل مقایسه نیستند"], correct: 2 },
      { q: `اگر محیط مربعی ۳۶ سانتی‌متر باشد، مساحتش کدام است؟`,
        options: ["۳۶","۸۱","۷۲","۱۰۸"], correct: 1 },
      { q: `در کلاسی ۲۵ نفره، ۶۰٪ دانش‌آموزان دخترند. تعداد پسران چند نفر است؟`,
        options: ["۱۰","۱۲","۱۵","۱۸"], correct: 0 }
    ]
  },

  /* ============ ۲. فارسی ششم ============ */
  {
    id: "farsi6", title: "فارسی و ادبیات ششم", duration: 15,
    questions: [
      { q: `معنی واژه «فراست» چیست؟`,
        options: ["دانش","هوشمندی و زیرکی","شجاعت","بخشندگی"], correct: 1 },
      { q: `در جمله «کتاب را روی میز گذاشتم»، واژه «کتاب» چه نقشی دارد؟`,
        options: ["نهاد","متمم","مسند","مفعول"], correct: 3 },
      { q: `متضاد واژه «شجاع» کدام است؟`,
        options: ["دلیر","جنگجو","ترسو","نیرومند"], correct: 2 },
      { q: `کدام واژه با بقیه «هم‌خانواده» نیست؟`,
        options: ["دانش","دانه","دانا","دانستن"], correct: 1 },
      { q: `معنی «به خشم آمد» چیست؟`,
        options: ["خندید","ترسید","گریه کرد","عصبانی شد"], correct: 3 },
      { q: `در بیت «بنی‌آدم اعضای یک پیکرند / که در آفرینش ز یک گوهرند»، شاعر بر چه چیزی تأکید دارد؟`,
        options: ["یگانگی و برابری انسان‌ها","برتری انسان‌ها بر یکدیگر","تنهایی انسان","قدرت طبیعت"], correct: 0 },
      { q: `کدام مورد آرایه «تشبیه» دارد؟`,
        options: ["دل او دریاست","باد می‌آید","او خیلی داناست","در باز است"], correct: 0 },
      { q: `جمع مکسر واژه «کتاب» کدام است؟`,
        options: ["کتاب‌ها","کاتب","کتب","مکتوب"], correct: 2 },
      { q: `در جمله «دیروز به مدرسه رفتم»، «دیروز» چه نوع قیدی است؟`,
        options: ["قید مکان","قید زمان","قید حالت","قید مقدار"], correct: 1 },
      { q: `معنی ضرب‌المثل «از این ستون به آن ستون فرج است» چیست؟`,
        options: ["دوری از خطر","سرعت در تصمیم","کمک به دیگران","صبر و امیدواری"], correct: 3 }
    ]
  },

  /* ============ ۳. املا و نگارش ششم ============ */
  {
    id: "emla6", title: "املا و نگارش ششم", duration: 15,
    questions: [
      { q: `در کدام گزینه غلط املایی وجود دارد؟`,
        options: ["استقامت","استعداد","اسطغفار","استقلال"], correct: 2 },
      { q: `کدام واژه صحیح نوشته شده است؟`,
        options: ["مصئول","مسئول","مسول","مصول"], correct: 1 },
      { q: `کدام گزینه غلط املایی دارد؟`,
        options: ["منتظر","منطقه","منظره","منظقه"], correct: 3 },
      { q: `املای درست کدام است؟`,
        options: ["تأثیر","تاثیر","تآثیر","تاءثیر"], correct: 0 },
      { q: `شکل صحیح کدام است؟`,
        options: ["اذعان","ازعان","اضغان","اذغان"], correct: 0 },
      { q: `در کدام گزینه غلط املایی وجود دارد؟`,
        options: ["استاد","استخوان","اسطلاح","استقلال"], correct: 2 },
      { q: `املای درست کدام است؟`,
        options: ["حاظر","حاضر","حاذر","هاضر"], correct: 1 },
      { q: `در کدام گزینه غلط املایی وجود دارد؟`,
        options: ["ارتقا","افتخار","اقتدار","ازدرام"], correct: 3 },
      { q: `کدام گزینه غلط املایی دارد؟`,
        options: ["اضافه","اضرار","اظهار","اظطراب"], correct: 3 },
      { q: `کدام جمله از نظر نگارشی درست است؟`,
        options: ["او به مدرسه رفت.","او به مدرسه رفت","او، به مدرسه رفت","او به مدرسه، رفت."], correct: 0 }
    ]
  },

  /* ============ ۴. علوم تجربی ششم ============ */
  {
    id: "oloom6", title: "علوم تجربی ششم", duration: 15,
    questions: [
      { q: `کدام‌یک از موارد زیر منبع انرژی تجدیدپذیر است؟`,
        options: ["نفت","زغال‌سنگ","انرژی خورشیدی","گاز طبیعی"], correct: 2 },
      { q: `در کدام لایه زمین ماگما (مواد مذاب) وجود دارد؟`,
        options: ["پوسته","گوشته","هسته بیرونی","هسته درونی"], correct: 1 },
      { q: `کدام‌یک از موارد زیر در فرآیند تولید کاغذ به کار می‌رود؟`,
        options: ["چوب","آهن","شیشه","پلاستیک"], correct: 0 },
      { q: `علت اصلی زلزله چیست؟`,
        options: ["بارش باران","وزش باد","ذوب یخ‌ها","حرکت ورقه‌های زمین"], correct: 3 },
      { q: `کدام‌یک از موارد زیر یک نیرو نیست؟`,
        options: ["وزن","اصطکاک","جرم","کشش"], correct: 2 },
      { q: `وقتی جسمی روی سطح شیب‌دار رها می‌شود، کدام نیرو آن را به حرکت درمی‌آورد؟`,
        options: ["اصطکاک","کشش فنر","مقاومت هوا","گرانش"], correct: 3 },
      { q: `در یک مدار الکتریکی ساده، برای روشن شدن لامپ کدام شرط لازم است؟`,
        options: ["بسته بودن مدار","باز بودن کلید","وجود باتری به‌تنهایی","وجود لامپ به‌تنهایی"], correct: 0 },
      { q: `ذره‌بینی که بزرگ‌نمایی می‌کند، از چه نوع عدسی ساخته شده است؟`,
        options: ["عدسی مقعر","عدسی محدب","آینه تخت","منشور"], correct: 1 },
      { q: `کدام‌یک از مواد زیر رسانای الکتریکی است؟`,
        options: ["چوب خشک","پلاستیک","مس","شیشه"], correct: 2 },
      { q: `در سلول خورشیدی، کدام انرژی به برق تبدیل می‌شود؟`,
        options: ["انرژی نورانی خورشید","انرژی باد","انرژی هسته‌ای","انرژی صوتی"], correct: 0 }
    ]
  }
];

/* ==================== مدیریت وضعیت ==================== */
const STATE_KEY = "online_exam_" + GRADE;
const PENDING_KEY = "pending_exam_" + GRADE;
const DEVICE_KEY = "device_id_" + GRADE;

let state = {
  student: { firstName: "", lastName: "", className: "" },
  results: {}, currentExam: null, currentAnswers: [],
  timerId: null, timeLeft: 0, submittedToServer: false
};

function getDeviceId() {
  let id = localStorage.getItem(DEVICE_KEY);
  if (!id) { id = "dev_" + Date.now() + "_" + Math.random().toString(36).substr(2,9);
    localStorage.setItem(DEVICE_KEY, id); }
  return id;
}
function saveState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e){} }
function loadState() {
  try { const s = localStorage.getItem(STATE_KEY);
    if (s) { const p = JSON.parse(s); if (p && p.student) state = Object.assign(state, p); } } catch(e){}
}
function resetAll() {
  if (!confirm("آیا مطمئنید؟ همه پاسخ‌ها و نمرات پاک خواهد شد.")) return;
  localStorage.removeItem(STATE_KEY); localStorage.removeItem(PENDING_KEY); location.reload();
}
function updateStatusBar() {
  const bar = document.getElementById("statusBar");
  if (navigator.onLine) { bar.className = "status-bar status-online";
    bar.textContent = "🌐 متصل — ارسال خودکار فعال"; }
  else { bar.className = "status-bar status-offline";
    bar.textContent = "📴 آفلاین — پاسخ‌ها ذخیره می‌شوند"; }
}
window.addEventListener("online", () => { updateStatusBar(); flushPending(); });
window.addEventListener("offline", updateStatusBar);

async function checkDuplicate(fn, ln, cn) {
  if (!navigator.onLine) return "unknown";
  try {
    const url = `${EXAM_ENDPOINT}?action=check&firstName=${encodeURIComponent(fn)}&lastName=${encodeURIComponent(ln)}&className=${encodeURIComponent(cn)}&grade=${encodeURIComponent(GRADE)}`;
    const res = await fetch(url); const data = await res.json(); return data.status;
  } catch(e) { return "unknown"; }
}

function renderWelcome() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="header">
        <div class="basmala">بسمه تعالی</div>
        <h1>${SCHOOL}</h1>
        <h2>سال تحصیلی ${YEAR} | پایه تحصیلی: ${GRADE}</h2>
        <h2>آزمون سنجش آغازین</h2>
        <div class="meta">تاریخ آزمون: ${EXAM_DATE}</div>
      </div>
      <div class="notice notice-info">
        <b>راهنما:</b> لطفاً مشخصات خود را وارد کنید. آزمون به‌صورت آفلاین و آنلاین کار می‌کند.
        در پایان، کارنامه شما صادر و به‌طور خودکار برای مدرسه ارسال می‌شود.
      </div>
      <div class="form-group">
        <label>نام:</label>
        <input type="text" id="firstName" placeholder="نام خود را وارد کنید" value="${state.student.firstName}">
      </div>
      <div class="form-group">
        <label>نام خانوادگی:</label>
        <input type="text" id="lastName" placeholder="نام خانوادگی خود را وارد کنید" value="${state.student.lastName}">
      </div>
      <div class="form-group">
        <label>کلاس:</label>
        <input type="text" id="className" placeholder="مثال: ۷۰۱" value="${state.student.className}">
      </div>
      <button class="btn btn-primary btn-block" id="startBtn" onclick="startExam()">ورود به آزمون ←</button>
    </div>
  `;
}

async function startExam() {
  const fn = document.getElementById("firstName").value.trim();
  const ln = document.getElementById("lastName").value.trim();
  const cn = document.getElementById("className").value.trim();
  if (!fn || !ln || !cn) { alert("لطفاً همه فیلدها را تکمیل کنید."); return; }
  const btn = document.getElementById("startBtn");
  btn.disabled = true; btn.textContent = "⏳ لطفاً صبر کنید...";
  const check = await checkDuplicate(fn, ln, cn);
  if (check === "duplicate") {
    alert("شما قبلاً در این آزمون شرکت کرده‌اید.\nبرای پیگیری با مدرسه تماس بگیرید.");
    btn.disabled = false; btn.textContent = "ورود به آزمون ←"; return;
  }
  state.student = { firstName: fn, lastName: ln, className: cn };
  state.submittedToServer = false;
  saveState(); renderDashboard();
}

function renderDashboard() {
  const doneCount = Object.keys(state.results).length;
  const allDone = doneCount === EXAMS.length;
  const locked = state.submittedToServer;
  const cardsHtml = EXAMS.map(ex => {
    const r = state.results[ex.id];
    let cls = "exam-card", status = "شروع آزمون", score = "";
    if (r) { cls += " done"; status = "✓ تکمیل شده"; score = `<div class="score">${r.score} از ۱۰</div>`; }
    return `<div class="${cls}" onclick="openExam('${ex.id}')">
      <h3>${ex.title}</h3><div class="status">${status}</div>${score}</div>`;
  }).join("");
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="header">
        <div class="basmala">بسمه تعالی</div>
        <h1>${SCHOOL}</h1>
        <h2>سال تحصیلی ${YEAR} | پایه تحصیلی: ${GRADE}</h2>
        <div class="meta">${state.student.firstName} ${state.student.lastName} — کلاس ${state.student.className}</div>
      </div>
      <div class="progress-bar"><div style="width:${(doneCount/EXAMS.length)*100}%"></div></div>
      <div class="notice notice-info">تعداد آزمون‌های تکمیل‌شده: <b>${doneCount}</b> از <b>${EXAMS.length}</b></div>
      <div class="exam-grid">${cardsHtml}</div>
      <div class="btn-group">
        ${allDone && !locked ? `<button class="btn btn-success btn-block" onclick="showReport()">📋 مشاهده کارنامه نهایی</button>` : ""}
        ${locked ? `<button class="btn btn-info btn-block" onclick="showReport()">📋 مشاهده کارنامه</button>` : ""}
        <button class="btn btn-warning" onclick="resetAll()">🔄 شروع مجدد</button>
      </div>
    </div>
  `;
}

function openExam(id) {
  if (state.submittedToServer) { alert("این آزمون قبلاً ارسال شده است."); return; }
  const exam = EXAMS.find(e => e.id === id);
  if (!exam) return;
  if (state.results[id]) { alert("شما قبلاً به این آزمون پاسخ داده‌اید."); return; }
  state.currentExam = id;
  state.currentAnswers = new Array(exam.questions.length).fill(-1);
  state.timeLeft = exam.duration * 60;
  renderExam(); startTimer();
}

function startTimer() {
  clearInterval(state.timerId);
  state.timerId = setInterval(() => {
    state.timeLeft--;
    const el = document.getElementById("timer");
    if (el) {
      const m = Math.floor(state.timeLeft/60), s = state.timeLeft % 60;
      el.textContent = `⏱ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      if (state.timeLeft <= 60) el.classList.add("warning");
    }
    if (state.timeLeft <= 0) {
      clearInterval(state.timerId);
      alert("زمان آزمون به پایان رسید. پاسخ‌ها خودکار ارسال می‌شوند.");
      submitExam();
    }
  }, 1000);
}

function renderExam() {
  const exam = EXAMS.find(e => e.id === state.currentExam);
  const m = Math.floor(state.timeLeft/60), s = state.timeLeft % 60;
  const letters = ["الف","ب","ج","د"];
  const questionsHtml = exam.questions.map((q, i) => `
    <div class="question">
      <div class="q-text">${i+1}. ${q.q}</div>
      ${q.options.map((opt, j) => `
        <label class="option" id="opt_${i}_${j}">
          <input type="radio" name="q_${i}" value="${j}" onchange="selectAnswer(${i}, ${j})"
            ${state.currentAnswers[i] === j ? "checked" : ""}>
          <span>${letters[j]}) ${opt}</span>
        </label>
      `).join("")}
    </div>
  `).join("");
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="timer" id="timer">⏱ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</div>
      <div class="header">
        <div class="basmala">بسمه تعالی</div>
        <h1>${SCHOOL}</h1>
        <h2>سال تحصیلی ${YEAR} | پایه تحصیلی: ${GRADE}</h2>
        <h2 style="font-weight:bold; color:#1e3c72;">آزمون ${exam.title}</h2>
        <div class="meta">${state.student.firstName} ${state.student.lastName} — کلاس ${state.student.className}</div>
      </div>
      ${questionsHtml}
      <div class="btn-group">
        <button class="btn btn-success btn-block" onclick="submitExam()">✅ ارسال پاسخ‌ها</button>
        <button class="btn btn-danger" onclick="cancelExam()">انصراف</button>
      </div>
    </div>
  `;
  state.currentAnswers.forEach((v, i) => { if (v >= 0) selectAnswer(i, v); });
  window.scrollTo(0,0);
}

function selectAnswer(qIdx, oIdx) {
  state.currentAnswers[qIdx] = oIdx;
  const exam = EXAMS.find(e => e.id === state.currentExam);
  exam.questions[qIdx].options.forEach((_, j) => {
    const el = document.getElementById(`opt_${qIdx}_${j}`);
    if (el) el.classList.toggle("selected", j === oIdx);
  });
}

function cancelExam() {
  if (!confirm("آیا مطمئنید؟ پاسخ‌های این آزمون ذخیره نمی‌شود.")) return;
  clearInterval(state.timerId);
  state.currentExam = null; renderDashboard();
}

function submitExam() {
  clearInterval(state.timerId);
  const exam = EXAMS.find(e => e.id === state.currentExam);
  let score = 0;
  exam.questions.forEach((q, i) => { if (state.currentAnswers[i] === q.correct) score++; });
  const elapsed = exam.duration*60 - state.timeLeft;
  const mins = Math.floor(elapsed/60), secs = elapsed % 60;
  state.results[exam.id] = {
    answers: [...state.currentAnswers], score: score,
    maxScore: exam.questions.length,
    time: `${mins}:${String(secs).padStart(2,"0")}`,
    examTitle: exam.title
  };
  saveState();
  const pct = (score/exam.questions.length)*100;
  const color = pct >= 80 ? "#27ae60" : pct >= 50 ? "#f39c12" : "#c0392b";
  const message = pct >= 80 ? "آفرین! عملکرد عالی 🌟" :
                  pct >= 50 ? "خوب بود، اما جای پیشرفت دارید 👍" :
                  "نیاز به تمرین بیشتر دارید 💪";
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="header"><h1>نتیجه آزمون</h1><h2>${exam.title}</h2></div>
      <div style="text-align:center; padding:30px;">
        <div style="font-size:64px; font-weight:bold; color:${color};">${score}</div>
        <div style="font-size:20px; color:#555;">از ${exam.questions.length}</div>
        <div style="margin-top:16px; padding:12px; background:#f8f9fa; border-radius:10px;">${message}</div>
        <div style="margin-top:14px; font-size:14px; color:#666;">زمان صرف‌شده: ${state.results[exam.id].time}</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary btn-block" onclick="backToDashboard()">بازگشت به فهرست آزمون‌ها</button>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function backToDashboard() { state.currentExam = null; renderDashboard(); }

function showReport() {
  const totalScore = EXAMS.reduce((sum, ex) => sum + (state.results[ex.id]?.score || 0), 0);
  const maxScore = EXAMS.length * 10;
  const avg = (totalScore / maxScore * 20).toFixed(2);
  const pct = (totalScore / maxScore * 100).toFixed(1);
  const rows = EXAMS.map(ex => {
    const r = state.results[ex.id] || { score: 0, time: "-" };
    const score20 = (r.score / 10 * 20).toFixed(2);
    return `<tr><td>${ex.title}</td><td>${r.score} از ۱۰</td><td>${score20} از ۲۰</td><td>${r.time}</td></tr>`;
  }).join("");
  const status = pct >= 80 ? "عالی" : pct >= 50 ? "قبول" : "نیاز به تلاش بیشتر";
  const statusColor = pct >= 80 ? "#27ae60" : pct >= 50 ? "#f39c12" : "#c0392b";
  document.getElementById("app").innerHTML = `
    <div class="card report" id="reportCard">
      <div class="report-header">
        <div class="basmala">بسمه تعالی</div>
        <h1>${SCHOOL}</h1>
        <h2>سال تحصیلی ${YEAR} | پایه تحصیلی: ${GRADE}</h2>
        <h3>کارنامه آزمون سنجش آغازین</h3>
        <div style="margin-top:6px; font-size:13px; color:#555;">تاریخ آزمون: ${EXAM_DATE}</div>
      </div>
      <div class="student-info">
        <div><b>نام و نام خانوادگی:</b> ${state.student.firstName} ${state.student.lastName}</div>
        <div><b>کلاس:</b> ${state.student.className}</div>
        <div><b>تعداد آزمون‌ها:</b> ${EXAMS.length} درس</div>
        <div><b>تاریخ صدور:</b> ${new Date().toLocaleDateString("fa-IR")}</div>
      </div>
      <table class="report-table">
        <thead><tr><th>درس</th><th>نمره از ۱۰</th><th>نمره از ۲۰</th><th>زمان</th></tr></thead>
        <tbody>${rows}
          <tr class="total"><td>مجموع</td><td>${totalScore} از ${maxScore}</td><td>${avg} از ۲۰</td><td>—</td></tr>
        </tbody>
      </table>
      <div class="notice" style="background:#f8f9fa; border-right:4px solid ${statusColor}; text-align:center; font-size:15px;">
        <b>معدل کل:</b> ${avg} از ۲۰ | <b>درصد:</b> ${pct}٪ | <b>وضعیت:</b> <span style="color:${statusColor}; font-weight:bold;">${status}</span>
      </div>
      <div class="report-footer">
        این کارنامه به‌صورت خودکار صادر شده است.<br>
        امضاء و مهر آموزشگاه: ......................................
      </div>
    </div>
    <div class="card no-print">
      ${!state.submittedToServer ? `<div class="notice notice-warning">
        <b>⚠️ توجه:</b> برای ثبت نهایی نمره در سامانه مدرسه، روی دکمه «ارسال به مدرسه» کلیک کنید.
      </div>` : `<div class="notice notice-success">
        <b>✓ ارسال شد:</b> کارنامه شما به مدرسه ارسال و ثبت شد.
      </div>`}
      <div class="btn-group">
        <button class="btn btn-primary" onclick="printReport()">🖨 چاپ / ذخیره PDF</button>
        <button class="btn btn-info" onclick="downloadReportHTML()">💾 دانلود فایل کارنامه</button>
        ${!state.submittedToServer ? `<button class="btn btn-success" onclick="sendToSchool()">📤 ارسال به مدرسه</button>` : ""}
        <button class="btn btn-warning" onclick="copyReport()">📋 کپی متن</button>
        <button class="btn btn-danger" onclick="backToDashboard()">← بازگشت</button>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function printReport() { window.print(); }

function downloadReportHTML() {
  const html = document.getElementById("reportCard").outerHTML;
  const css = `<style>body{font-family:"Vazirmatn","B Nazanin",Tahoma,sans-serif;direction:rtl;text-align:right;padding:20px;background:#fff}.report{max-width:800px;margin:0 auto;padding:30px;background:#fff}.report-header{text-align:center;border-bottom:3px double #1e3c72;padding-bottom:14px;margin-bottom:20px}.report-header h1{color:#1e3c72;font-size:22px;margin:4px 0}.report-header h2{color:#555;font-size:15px;font-weight:normal}.report-header h3{color:#2a5298;font-size:17px;margin-top:8px}.student-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;padding:14px;background:#f8f9fa;border-radius:10px}.student-info div{font-size:14px}.student-info b{color:#1e3c72}.report-table{width:100%;border-collapse:collapse;margin-bottom:20px}.report-table th,.report-table td{border:1px solid #ddd;padding:10px;text-align:center;font-size:14px}.report-table th{background:#1e3c72;color:#fff}.report-table .total{background:#fff3cd;font-weight:bold}.notice{padding:14px;border-radius:8px;margin-bottom:14px;font-size:14px}.report-footer{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid #ddd;font-size:13px;color:#666}</style>`;
  const fullHtml = `<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>کارنامه ${state.student.firstName} ${state.student.lastName}</title>${css}</head><body>${html}</body></html>`;
  const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `کارنامه_${state.student.firstName}_${state.student.lastName}_پایه${GRADE}.html`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  alert("✓ فایل کارنامه دانلود شد.");
}

function copyReport() {
  const lines = [`📋 کارنامه — ${SCHOOL}`, `پایه: ${GRADE} | ${YEAR}`,
    `👤 ${state.student.firstName} ${state.student.lastName} — کلاس ${state.student.className}`, ""];
  let total = 0;
  EXAMS.forEach(ex => { const s = state.results[ex.id]?.score || 0; total += s;
    lines.push(`• ${ex.title}: ${s}/۱۰`); });
  const avg = (total/(EXAMS.length*10)*20).toFixed(2);
  lines.push("", `📊 معدل: ${avg} از ۲۰`);
  navigator.clipboard.writeText(lines.join("\n"))
    .then(() => alert("✓ متن کپی شد."))
    .catch(() => prompt("متن:", lines.join("\n")));
}

function buildPayload() {
  const totalScore = EXAMS.reduce((sum, ex) => sum + (state.results[ex.id]?.score || 0), 0);
  const maxScore = EXAMS.length * 10;
  const avg = (totalScore / maxScore * 20).toFixed(2);
  const pct = (totalScore / maxScore * 100);
  const status = pct >= 80 ? "عالی" : pct >= 50 ? "قبول" : "نیاز به تلاش بیشتر";
  return {
    firstName: state.student.firstName, lastName: state.student.lastName,
    className: state.student.className, grade: GRADE,
    deviceId: getDeviceId(), timestamp: new Date().toISOString(),
    results: EXAMS.map(ex => {
      const r = state.results[ex.id] || { score: 0, time: "-", answers: [] };
      return { examId: ex.id, examTitle: ex.title, score: r.score,
        maxScore: 10, time: r.time, answers: r.answers };
    }),
    totalScore: totalScore, average: avg, status: status
  };
}

async function sendToSchool() {
  if (state.submittedToServer) { alert("قبلاً ارسال شده است."); return; }
  const payload = buildPayload();
  if (!navigator.onLine) {
    localStorage.setItem(PENDING_KEY, JSON.stringify(payload));
    alert("📴 شما آفلاین هستید.\nاطلاعات ذخیره شد و به‌طور خودکار ارسال می‌شود."); return;
  }
  await doSend(payload);
}

async function doSend(payload) {
  const bar = document.getElementById("statusBar");
  bar.className = "status-bar status-syncing";
  bar.textContent = "⏳ در حال ارسال...";
  try {
    await fetch(EXAM_ENDPOINT, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload) });
    state.submittedToServer = true; saveState();
    localStorage.removeItem(PENDING_KEY);
    updateStatusBar();
    alert("✅ کارنامه با موفقیت به مدرسه ارسال شد.");
    showReport();
  } catch(e) {
    localStorage.setItem(PENDING_KEY, JSON.stringify(payload));
    updateStatusBar();
    alert("⚠️ ارسال ناموفق بود. اطلاعات ذخیره شد.");
  }
}

async function flushPending() {
  const pending = localStorage.getItem(PENDING_KEY);
  if (!pending) return;
  try { await doSend(JSON.parse(pending)); } catch(e) {}
}
setInterval(() => { if (navigator.onLine) flushPending(); }, 30000);

/* ==================== شروع ==================== */
loadState(); updateStatusBar(); flushPending();
if (state.student && state.student.firstName) renderDashboard();
else renderWelcome();
</script>
</body>
</html>
